<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button — preview</title></head>
<body>
<div class="pv pv-stack">
  <button class="btn" type="button">Agree &amp; continue</button>
  <button class="btn btn--ghost" type="button">✓ Done — tap to undo</button>
  <button class="btn" type="button" disabled>Continue</button>
  <div class="pv-row">
    <button class="btn btn--small" type="button">Cash in</button>
    <button class="btn btn--link btn--small" type="button">Not now — start with Declan</button>
  </div>
</div>
</body>
</html>
