<!doctype html>
<html>
<head><meta charset="utf-8"><title>ProposalCard — preview</title></head>
<body>
<div class="pv">
  <div class="proposal">
    <div class="proposal-head">Suggested next step</div>
    <div class="proposal-label">Add a stretch goal</div>
    <div class="nudge"><span class="nudge-tag">Draft message</span><p>“Great week. Want to try for a perfect day tomorrow — everything on the list?”</p></div>
    <div class="row" style="gap:var(--s-2);margin-top:var(--s-3)"><button class="btn" type="button">Apply this</button><button class="btn btn--ghost" type="button">Not now</button></div>
    <p class="muted" style="margin-top:var(--s-2)">Nothing changes in the app until you apply it.</p>
  </div>
</div>
</body>
</html>
